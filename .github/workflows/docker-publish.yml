name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "app/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kube-trader
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm chart image tag and version
        id: chart
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          chart_file=helm/kube-trader/Chart.yaml
          values_file=helm/kube-trader/values.yaml

          chart_version="$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}$/\1/p' "$chart_file")"
          if [[ ! "$chart_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Helm chart version: ${chart_version:-missing}" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$chart_version"
          next_version="$major.$minor.$((patch + 1))"

          sed -i "s/^  tag: .*/  tag: $IMAGE_TAG/" "$values_file"
          sed -i "s/^version: .*/version: $next_version/" "$chart_file"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Commit chart update
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/kube-trader/values.yaml helm/kube-trader/Chart.yaml
          git commit -m "chore(helm): publish image $IMAGE_TAG as chart $CHART_VERSION"
          git push

      - name: Dispatch Helm chart publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run helm-publish.yml --ref main
