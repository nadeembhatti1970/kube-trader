apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-trader-config
  namespace: kube-trader
data:
  ALPACA_PAPER: "true" # Set to "false" only for intentional live trading.
  ALPACA_DATA_FEED: iex
  MARKET_DATA_PROVIDER: yfinance
  MARKET_STREAM_ENABLED: "false"
  EXECUTION_ENABLED: "false"
  STOP_MANAGEMENT_ENABLED: "true"
  REDIS_URL: redis://redis:6379/0
  DATABASE_PATH: /data/market.db
  ETF_HOLDINGS_SYMBOL: SPY
  ETF_HOLDINGS_URL: https://www.ssga.com/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx
  ETF_MAX_HOLDINGS: "100"
  UNIVERSE_REFRESH_SECONDS: "86400"
  UNIVERSE_SCREEN_ENABLED: "true"
  MIN_SYMBOL_PRICE: "5"
  MIN_AVG_DOLLAR_VOLUME: "20000000"
  MAX_WATCHLIST_SYMBOLS: "40"
  SYMBOL_SECTORS: ""
  MAX_OPEN_POSITIONS: "20"
  MAX_SYMBOL_EXPOSURE_PCT: "0.05"
  EXTENDED_HOURS_SAMPLING_ENABLED: "true"
  EXTENDED_HOURS_SAMPLE_SECONDS: "300"
  INTRADAY_FLATTEN_MINUTES: "10"
  INTRADAY_ENTRY_CUTOFF_MINUTES: "30"
  SYMBOL_LOSS_COOLDOWN_SECONDS: "1800"
  SYMBOL_DAILY_LOSS_LIMIT: "50"
  MAX_SECTOR_EXPOSURE_PCT: "0.25"
  MAX_TRADE_RISK_PCT: "0.01"
  DAILY_DRAWDOWN_LIMIT_PCT: "0.03"
  STOP_LOSS_PCT: "0.02"
  TAKE_PROFIT_PCT: "0.04"
  INTRADAY_ALLOCATION_PCT: "0.20"
  SWING_ALLOCATION_PCT: "0.30"
  CORE_ALLOCATION_PCT: "0.50"
  SIGNAL_FAST_BARS: "5"
  SIGNAL_SLOW_BARS: "20"
  SWING_ATR_PERIOD: "14"
  SWING_ATR_MULTIPLE: "2.0"
  CORE_STOP_LOSS_PCT: "0.20"
  BACKTEST_COST_BPS: "5"
  BACKTEST_TRAIN_FRACTION: "0.70"
  INTRADAY_BACKTEST_BARS: "50000"
  RECONCILE_INTERVAL_SECONDS: "30"
  MAX_SIGNAL_AGE_SECONDS: "180"
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-trader-api-data
  namespace: kube-trader
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-trader-api
  namespace: kube-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-trader-api
  template:
    metadata:
      labels:
        app: kube-trader-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: kube-trader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kube-trader-config
            - secretRef:
                name: kube-trader-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kube-trader-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: kube-trader-api
  namespace: kube-trader
spec:
  selector:
    app: kube-trader-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-trader-ingestion
  namespace: kube-trader
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-trader-ingestion}
  template:
    metadata:
      labels: {app: kube-trader-ingestion}
    spec:
      containers:
        - name: ingestion
          image: kube-trader:latest
          command: [python, -m, app.services.ingestion]
          envFrom:
            - configMapRef: {name: kube-trader-config}
            - secretRef: {name: kube-trader-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
