apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-trader-config
  namespace: kube-trader
data:
  MARKET_DATA_PROVIDER: yfinance
  ALPACA_PAPER: "true"
  TRADING_ENABLED: "false"
  DATABASE_PATH: /data/market.db
  DEFAULT_SYMBOLS: AAPL,MSFT,SPY
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-trader-data
  namespace: kube-trader
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-trader
  namespace: kube-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-trader
  template:
    metadata:
      labels:
        app: kube-trader
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: kube-trader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kube-trader-config
            - secretRef:
                name: kube-trader-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kube-trader-data
---
apiVersion: v1
kind: Service
metadata:
  name: kube-trader
  namespace: kube-trader
spec:
  selector:
    app: kube-trader
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP

