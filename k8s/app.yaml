apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-trader-config
  namespace: kube-trader
data:
  ALPACA_PAPER: "true"
  ALPACA_DATA_FEED: iex
  MARKET_DATA_PROVIDER: yfinance
  MARKET_STREAM_ENABLED: "false"
  EXECUTION_ENABLED: "false"
  STOP_MANAGEMENT_ENABLED: "false"
  REDIS_URL: redis://redis:6379/0
  DATABASE_PATH: /data/market.db
  DEFAULT_SYMBOLS: AAPL,MSFT,SPY
  MAX_TRADE_RISK_PCT: "0.01"
  DAILY_DRAWDOWN_LIMIT_PCT: "0.03"
  STOP_LOSS_PCT: "0.02"
  TAKE_PROFIT_PCT: "0.04"
  INTRADAY_ALLOCATION_PCT: "0.20"
  SWING_ALLOCATION_PCT: "0.30"
  CORE_ALLOCATION_PCT: "0.50"
  SIGNAL_FAST_BARS: "5"
  SIGNAL_SLOW_BARS: "20"
  RECONCILE_INTERVAL_SECONDS: "30"
  MAX_SIGNAL_AGE_SECONDS: "180"
  LOG_LEVEL: INFO
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-trader-api-data
  namespace: kube-trader
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-trader-api
  namespace: kube-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-trader-api
  template:
    metadata:
      labels:
        app: kube-trader-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: kube-trader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: kube-trader-config
            - secretRef:
                name: kube-trader-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kube-trader-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: kube-trader-api
  namespace: kube-trader
spec:
  selector:
    app: kube-trader-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-trader-ingestion
  namespace: kube-trader
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-trader-ingestion}
  template:
    metadata:
      labels: {app: kube-trader-ingestion}
    spec:
      containers:
        - name: ingestion
          image: kube-trader:latest
          command: [python, -m, app.services.ingestion]
          envFrom:
            - configMapRef: {name: kube-trader-config}
            - secretRef: {name: kube-trader-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
