apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-trader.fullname" . }}
data:
  MARKET_DATA_PROVIDER: {{ .Values.config.marketDataProvider | quote }}
  ALPACA_PAPER: {{ .Values.config.alpacaPaper | quote }}
  ALPACA_DATA_FEED: {{ .Values.config.alpacaDataFeed | quote }}
  MARKET_STREAM_ENABLED: {{ .Values.config.marketStreamEnabled | quote }}
  EXECUTION_ENABLED: {{ .Values.config.executionEnabled | quote }}
  STOP_MANAGEMENT_ENABLED: {{ .Values.config.stopManagementEnabled | quote }}
  REDIS_URL: redis://{{ include "kube-trader.fullname" . }}-redis:6379/0
  MAX_TRADE_RISK_PCT: {{ .Values.config.maxTradeRiskPct | quote }}
  DAILY_DRAWDOWN_LIMIT_PCT: {{ .Values.config.dailyDrawdownLimitPct | quote }}
  STOP_LOSS_PCT: {{ .Values.config.stopLossPct | quote }}
  TAKE_PROFIT_PCT: {{ .Values.config.takeProfitPct | quote }}
  INTRADAY_ALLOCATION_PCT: {{ .Values.config.intradayAllocationPct | quote }}
  SWING_ALLOCATION_PCT: {{ .Values.config.swingAllocationPct | quote }}
  CORE_ALLOCATION_PCT: {{ .Values.config.coreAllocationPct | quote }}
  SIGNAL_FAST_BARS: {{ .Values.config.signalFastBars | quote }}
  SIGNAL_SLOW_BARS: {{ .Values.config.signalSlowBars | quote }}
  SWING_ATR_PERIOD: {{ .Values.config.swingAtrPeriod | quote }}
  SWING_ATR_MULTIPLE: {{ .Values.config.swingAtrMultiple | quote }}
  CORE_STOP_LOSS_PCT: {{ .Values.config.coreStopLossPct | quote }}
  RECONCILE_INTERVAL_SECONDS: {{ .Values.config.reconcileIntervalSeconds | quote }}
  ALPACA_ACTIVITY_SYNC_SECONDS: {{ .Values.config.alpacaActivitySyncSeconds | quote }}
  ALPACA_ACTIVITY_LOOKBACK_DAYS: {{ .Values.config.alpacaActivityLookbackDays | quote }}
  MAX_SIGNAL_AGE_SECONDS: {{ .Values.config.maxSignalAgeSeconds | quote }}
  DATABASE_PATH: /data/market.db
  ETF_HOLDINGS_SYMBOL: {{ .Values.config.etfHoldingsSymbol | quote }}
  ETF_HOLDINGS_URL: {{ .Values.config.etfHoldingsUrl | quote }}
  ETF_MAX_HOLDINGS: {{ .Values.config.etfMaxHoldings | quote }}
  UNIVERSE_REFRESH_SECONDS: {{ .Values.config.universeRefreshSeconds | quote }}
  UNIVERSE_SCREEN_ENABLED: {{ .Values.config.universeScreenEnabled | quote }}
  MIN_SYMBOL_PRICE: {{ .Values.config.minSymbolPrice | quote }}
  MIN_AVG_DOLLAR_VOLUME: {{ .Values.config.minAvgDollarVolume | quote }}
  MAX_WATCHLIST_SYMBOLS: {{ .Values.config.maxWatchlistSymbols | quote }}
  SYMBOL_SECTORS: {{ .Values.config.symbolSectors | quote }}
  MAX_OPEN_POSITIONS: {{ .Values.config.maxOpenPositions | quote }}
  MAX_SYMBOL_EXPOSURE_PCT: {{ .Values.config.maxSymbolExposurePct | quote }}
  MAX_SECTOR_EXPOSURE_PCT: {{ .Values.config.maxSectorExposurePct | quote }}
  BACKTEST_COST_BPS: {{ .Values.config.backtestCostBps | quote }}
  BACKTEST_TRAIN_FRACTION: {{ .Values.config.backtestTrainFraction | quote }}
  INTRADAY_BACKTEST_BARS: {{ .Values.config.intradayBacktestBars | quote }}
  LOG_LEVEL: INFO
