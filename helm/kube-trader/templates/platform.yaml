---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-trader.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app: {{ include "kube-trader.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kube-trader.fullname" . }}-postgres
spec:
  serviceName: {{ include "kube-trader.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "kube-trader.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "kube-trader.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kube_trader
            - name: POSTGRES_USER
              value: kube_trader
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-trader.fullname" . }}-redis
spec:
  clusterIP: None
  selector:
    app: {{ include "kube-trader.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kube-trader.fullname" . }}-redis
spec:
  serviceName: {{ include "kube-trader.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "kube-trader.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "kube-trader.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: [redis-server, --appendonly, "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}

