replicaCount: 1
image:
  repository: kube-trader
  tag: sha-a114b62f4593c52f92d72b9fc120cf2349739bf1
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
config:
  marketDataProvider: yfinance
  marketStreamEnabled: true
  executionEnabled: true
  stopManagementEnabled: false
  alpacaPaper: true
  alpacaDataFeed: iex
  etfHoldingsSymbol: SPY
  etfHoldingsUrl: https://www.ssga.com/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx
  etfMaxHoldings: "100"
  universeRefreshSeconds: "86400"
  universeScreenEnabled: true
  minSymbolPrice: "5"
  minAvgDollarVolume: "20000000"
  maxWatchlistSymbols: "40"
  symbolSectors: ""
  maxOpenPositions: "20"
  maxSymbolExposurePct: "0.05"
  extendedHoursSamplingEnabled: "true"
  extendedHoursSampleSeconds: "300"
  intradayFlattenMinutes: "10"
  intradayEntryCutoffMinutes: "30"
  symbolLossCooldownSeconds: "1800"
  symbolDailyLossLimit: "50"
  maxSectorExposurePct: "0.25"
  maxTradeRiskPct: "0.01"
  dailyDrawdownLimitPct: "0.03"
  stopLossPct: "0.02"
  takeProfitPct: "0.04"
  intradayAllocationPct: "0.20"
  swingAllocationPct: "0.30"
  coreAllocationPct: "0.50"
  signalFastBars: "5"
  signalSlowBars: "20"
  swingAtrPeriod: "14"
  swingAtrMultiple: "2.0"
  coreStopLossPct: "0.20"
  backtestCostBps: "5"
  backtestTrainFraction: "0.70"
  intradayBacktestBars: "50000"
  reconcileIntervalSeconds: "30"
  alpacaActivitySyncSeconds: "300"
  alpacaActivityLookbackDays: "30"
  maxSignalAgeSeconds: "180"
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
postgres:
  image: postgres:16-alpine
  storage: 10Gi
redis:
  image: redis:7-alpine
  storage: 2Gi
secrets:
  existingSecret: kube-trader-secrets
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
