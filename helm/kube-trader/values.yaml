replicaCount: 1
image:
  repository: kube-trader
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
config:
  marketDataProvider: yfinance
  marketStreamEnabled: false
  executionEnabled: false
  stopManagementEnabled: false
  alpacaPaper: true
  alpacaDataFeed: iex
  defaultSymbols: AAPL,MSFT,SPY
  maxTradeRiskPct: "0.01"
  dailyDrawdownLimitPct: "0.03"
  stopLossPct: "0.02"
  takeProfitPct: "0.04"
  intradayAllocationPct: "0.20"
  swingAllocationPct: "0.30"
  coreAllocationPct: "0.50"
  signalFastBars: "5"
  signalSlowBars: "20"
  reconcileIntervalSeconds: "30"
  maxSignalAgeSeconds: "180"
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
postgres:
  image: postgres:16-alpine
  storage: 10Gi
redis:
  image: redis:7-alpine
  storage: 2Gi
secrets:
  existingSecret: kube-trader-secrets
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

